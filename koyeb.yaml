{
  "apps": [
    {
      "name": "ancasure-api",
      "docker": {
        "dockerfile": "Dockerfile"
      },
      "ports": [
        {
          "port": 3000,
          "protocol": "http",
          "health_check": {
            "http_path": "/health",
            "initial_delay_seconds": 10
          }
        }
      ],
      "routes": [
        {
          "path": "/",
          "port": 3000
        }
      ],
      "env": [
        { "key": "PORT", "value": "3000" },
        { "key": "NODE_ENV", "value": "production" },
        { "key": "SEPOLIA_RPC_URL", "value": "YOUR_SEPOLIA_RPC_URL" },
        { "key": "PRIVATE_KEY", "value": "YOUR_PRIVATE_KEY" },
        { "key": "AUTHORIZER_PRIVATE_KEY", "value": "YOUR_AUTHORIZER_PRIVATE_KEY" },
        { "key": "CLAIMS_CONTRACT_ADDRESS", "value": "YOUR_CLAIMS_CONTRACT_ADDRESS" },
        { "key": "TURSO_DATABASE_URL", "value": "YOUR_TURSO_DATABASE_URL" },
        { "key": "TURSO_AUTH_TOKEN", "value": "YOUR_TURSO_AUTH_TOKEN" },
        { "key": "CREDITCOIN_RPC_URL", "value": "https://rpc.cc3-testnet.creditcoin.network" },
        { "key": "ATTESTCOIN_PROVER_URL", "value": "https://prover.cc3-testnet.creditcoin.network" }
      ],
      "instance_types": [
        { "type": "nano" }
      ],
      "regions": [
        "was"
      ],
      "scaling": {
        "min": 1,
        "max": 1
      }
    }
  ]
}
